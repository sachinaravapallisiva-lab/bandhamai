<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Bandham AI</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
        color: #1e1b36;
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        box-sizing: border-box;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 24px
          calc(24px + env(safe-area-inset-bottom, 0px));
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 400;
      }
      p {
        margin: 8px 0 0;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        color: #7b77a8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bandhamai</h1>
      <p>Ask, don't swipe</p>
    </main>
  </body>
</html>
